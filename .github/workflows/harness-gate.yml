# Harness release gate — governance suites that must be green before a release.
# Copy to .github/workflows/harness-gate.yml (the installer's -WithCiGates does
# this for you). Stack-agnostic on purpose: it runs only the harness's OWN suites,
# which ship with the bundle and need nothing but Python. Your project's tests
# live in tests.yml.template, which detects your runner.
#
# Why this calls harness_policy_check.py rather than listing individual checks:
# checks get added every release, and a workflow that enumerates them silently
# stops covering the new ones. One entry point cannot go stale.
name: harness-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  policy-ci:
    name: Policy CI (schemas, C4/C5/C8/C10, plane separation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jsonschema
      # The positional root argument is required -- without it the script cannot
      # find .harness/ and reports a layout failure that looks like a real one.
      - name: harness policy-ci
        run: python .harness/scripts/lib/harness_policy_check.py . --ci

  doctor:
    name: Harness doctor (evidence pipeline health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # NOT --strict here, on purpose. doctor asserts runtime EVIDENCE (ledger
      # chain, telemetry reports) and that evidence is deliberately gitignored —
      # it churns on every tool call. A fresh CI checkout therefore has none of
      # it, so --strict fails 100% of the time and can never go green. A gate
      # that is always red teaches people to ignore red (C14), which costs more
      # than the check was ever worth.
      #
      # The evidence checks belong where the evidence exists: locally, and at
      # pre-push. What CI CAN honestly assert is the parts that live in git —
      # policy, schemas, golden cases, secrets — and those are the other jobs
      # in this workflow, which do gate the build.
      - name: harness doctor (advisory — evidence lives outside the checkout)
        run: python .harness/scripts/lib/harness_doctor.py .

  secret-scan:
    name: Secret scan (C5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secret-scan
        run: bash .harness/scripts/bash/secret-scan.sh --ci

  golden:
    name: Golden dataset regression (H3)
    runs-on: ubuntu-latest
    needs: [policy-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: harness golden
        run: python .harness/scripts/lib/harness_golden.py .
