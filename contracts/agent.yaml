# Agent Contract — SSOT for agent fleet definitions and model profiles
schema_version: "1.0.0"

# Model profiles abstract capability from specific models (D4)
model_profiles:
  planning:
    description: "Strategic planning, architecture, orchestration"
    primary: "claude-fable-5"
    fallback: "claude-opus-4-8"
    power_map:
      1-3: "claude-haiku-4-5"
      4-6: "claude-sonnet-5"
      7-9: "claude-opus-4-8"
      10: "claude-fable-5"

  # Deliberately cheaper than `planning`. The intake gate runs on EVERY request
  # before any code is written, so putting the top planning model there taxes the
  # whole pipeline for a triage decision — is this request clear, in-scope, and
  # allowed — that a small model answers well. Escalates to sonnet only at high
  # power, for the requests that are genuinely ambiguous.
  planning-light:
    description: "Pre-code triage: intake gating, clarification, duplication check"
    primary: "claude-haiku-4-5"
    fallback: "claude-sonnet-5"
    power_map:
      1-7: "claude-haiku-4-5"
      8-10: "claude-sonnet-5"

  coding:
    description: "Implementation, code generation, refactoring"
    primary: "claude-sonnet-5"
    fallback: "claude-opus-4-8"
    power_map:
      1-3: "claude-haiku-4-5"
      4-7: "claude-sonnet-5"
      8-10: "claude-opus-4-8"

  review:
    description: "Code review, quality assessment, security audit"
    primary: "claude-opus-4-8"
    fallback: "claude-sonnet-5"
    power_map:
      1-3: "claude-sonnet-5"
      4-7: "claude-opus-4-8"
      8-10: "claude-opus-4-8"

  summarization:
    description: "Summarization, reporting, telemetry aggregation"
    primary: "claude-haiku-4-5"
    fallback: "claude-sonnet-5"
    power_map:
      1-7: "claude-haiku-4-5"
      8-10: "claude-sonnet-5"

# Agent fleet definitions — 11 agents across Tier 3 and Tier 2
agents:
  - name: "boss"
    description: "Tier 3 orchestrator — plans, delegates, manages pipeline context"
    model_profile: "planning"
    authority: "orchestration_only"
    allowed_tools: ["start_workflow", "request_approval", "get_project_context", "Read", "Write", "Edit", "Agent", "Glob", "Grep"]
    blocked_tools: ["run_command", "deploy", "mysql_query", "http_fetch"]
    definition: ".claude/agents/boss.md"

  - name: "architect"
    description: "Tier 2 — system architecture design, ADRs, trade-off evaluation"
    model_profile: "planning"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "WebFetch"]
    blocked_tools: ["Write", "Edit", "Bash", "PowerShell", "run_command", "deploy"]
    definition: ".claude/agents/architect.md"

  - name: "analyst"
    description: "Tier 2 — requirement analysis and specification review"
    model_profile: "planning"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "WebFetch"]
    blocked_tools: ["Write", "Edit", "Bash", "PowerShell", "run_command", "deploy"]
    definition: ".claude/agents/analyst.md"

  - name: "researcher"
    description: "Tier 2 — deep-dive investigation, vulnerability research, dependency analysis"
    model_profile: "planning"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep", "WebSearch", "WebFetch"]
    blocked_tools: ["Write", "Edit", "Bash", "PowerShell", "run_command", "deploy"]
    definition: ".claude/agents/researcher.md"

  - name: "developer"
    description: "Tier 2 — implements code changes per analysis"
    model_profile: "coding"
    authority: "specialist"
    allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "PowerShell"]
    blocked_tools: ["deploy", "mysql_query", "http_fetch", "exec_in_container"]
    definition: ".claude/agents/developer.md"

  - name: "tester"
    description: "Tier 2 — writes and runs tests, produces test reports"
    model_profile: "coding"
    authority: "specialist"
    allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "PowerShell"]
    blocked_tools: ["deploy", "mysql_query", "http_fetch"]
    definition: ".claude/agents/tester.md"

  - name: "devops"
    description: "Tier 2 — CI/CD, deployments, infrastructure-as-code"
    model_profile: "coding"
    authority: "specialist"
    allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "PowerShell"]
    blocked_tools: ["mysql_query"]
    definition: ".claude/agents/devops.md"

  - name: "reviewer"
    description: "Tier 2 — verifies implementation meets requirements"
    model_profile: "review"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep"]
    blocked_tools: ["Write", "Edit", "Bash", "PowerShell", "run_command", "deploy"]
    definition: ".claude/agents/reviewer.md"

  - name: "writer"
    description: "Tier 2 — technical documentation, changelogs, migration guides"
    model_profile: "summarization"
    authority: "specialist"
    allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep"]
    blocked_tools: ["Bash", "PowerShell", "run_command", "deploy", "mysql_query"]
    definition: ".claude/agents/writer.md"

  # --- v1.6.0: the two gates that bracket the coding stages ---
  # gatekeeper runs BEFORE any code exists, qa-reviewer AFTER it does. Both are
  # read-only by construction: a gate that can edit the thing it is judging is
  # not a gate. gatekeeper is additionally denied request_approval's siblings --
  # it may ASK for approval but never grant its own.
  - name: "gatekeeper"
    description: "Tier 2 — pre-code intake triage: is this request clear, in-scope, allowed, and not already done?"
    model_profile: "planning-light"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep", "get_project_context", "request_approval"]
    blocked_tools: ["Write", "Edit", "Bash", "PowerShell", "run_command", "deploy", "mysql_query", "http_fetch"]
    definition: ".claude/agents/gatekeeper.md"

  # Bash is granted for ONE reason: to run test suites. The verdict rule that
  # makes this agent worth having -- suites not actually run means
  # CHANGES_REQUIRED, never APPROVED -- is unenforceable if it cannot run them.
  # Everything that could change the code under review stays blocked.
  - name: "qa-reviewer"
    description: "Tier 2 — adversarial post-implementation QA gate; verdict must cite executed tests"
    model_profile: "review"
    authority: "specialist"
    allowed_tools: ["Read", "Glob", "Grep", "Bash", "__workflow_gate__"]
    blocked_tools: ["Write", "Edit", "PowerShell", "run_command", "deploy", "rollback_deploy", "mysql_query"]
    definition: ".claude/agents/qa-reviewer.md"

# Local tier (OSS on-prem models) — separate ladder, never called Claude (D4)
local_tier:
  enabled: false
  provider: "ollama"
  models: []
  power_map: {}
